<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOMI - Room</title>
    <link rel="stylesheet" href="room.css">
    <style>
        /* أنماط مخصصة للرد والتفاعلات */
        .reply-preview-bar {
            display: none;
            background: #eef2f5;
            border-right: 4px solid #6200ea;
            padding: 6px 12px;
            font-size: 12px;
            margin-bottom: 6px;
            border-radius: 4px;
            position: relative;
        }
        .reply-preview-bar .close-reply {
            position: absolute;
            left: 8px;
            top: 4px;
            cursor: pointer;
            font-weight: bold;
            color: #888;
        }
        .reply-box-in-msg {
            background: rgba(0, 0, 0, 0.05);
            border-right: 3px solid #6200ea;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            margin-bottom: 4px;
            color: #444;
        }
        .message-actions {
            display: inline-block;
            margin-right: 6px;
            font-size: 11px;
            cursor: pointer;
            opacity: 0.7;
        }
        .message-actions:hover {
            opacity: 1;
        }
        .reactions-bar {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            font-size: 12px;
        }
        .reaction-badge {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 1px 6px;
            font-size: 11px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .reaction-picker-mini {
            display: none;
            position: absolute;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 18px;
            padding: 2px 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 100;
        }
        .reaction-picker-mini span {
            cursor: pointer;
            padding: 2px 4px;
            font-size: 14px;
        }
        .reaction-picker-mini span:hover {
            transform: scale(1.2);
        }
        .message {
            position: relative;
        }
    </style>
</head>

<body>
    <div style="display: flex; justify-content: space-between; align-items: center; width: 90%; max-width: 600px;">
        <h1>Room Chat</h1>
        <button id="clearChatBtn" style="background-color: #ff4d4d; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">🗑️ مسح المحادثة</button>
    </div>

    <p id="roomInfo">
        أنت في الغرفة: <span id="roomIdText"></span>
        <button id="copyRoomId">📋</button>
    </p>

    <div id="hostControls" style="display: none; background: #f0f0f0; padding: 10px; border-radius: 8px; margin-bottom: 10px; width: 90%; max-width: 600px;">
        <label for="capacityInput"><strong>سعة الغرفة القصوى:</strong></label>
        <input type="number" id="capacityInput" min="1" max="100" style="width: 60px; padding: 4px;">
        <button id="updateCapacityBtn" style="background: #6200ea; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">تحديث السعة</button>
    </div>

    <div id="chatContainer"></div>

    <div id="statusIndicator" style="font-size: 13px; color: #6200ea; height: 20px; font-style: italic; margin-bottom: 5px;"></div>

    <div id="stickerPicker">

            <button class="tab-btn active" onclick="switchTab('emojisTab', this)">😃 Emojis</button>
            <button class="tab-btn" onclick="switchTab('stickersTab', this)">👾 Stickers</button>
        </div>

        <div id="emojisTab" class="tab-content active">

            <span class="emoji-item" onclick="insertEmoji('😂')">😂</span>
            <span class="emoji-item" onclick="insertEmoji('🔥')">🔥</span>
            <span class="emoji-item" onclick="insertEmoji('🎉')">🎉</span>
            <span class="emoji-item" onclick="insertEmoji('😎')">😎</span>
            <span class="emoji-item" onclick="insertEmoji('🙏')">🙏</span>
            <span class="emoji-item" onclick="insertEmoji('😍')">😍</span>

    <!-- شريط معاينة الرد قبل الإرسال -->
    <div id="replyPreview" class="reply-preview-bar">
        <span class="close-reply" onclick="cancelReply()">✕</span>
        <div>الرد على <strong id="replyTargetUser"></strong>:</div>
        <div id="replyTargetText" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
    </div>

    <div class="input-container">
        <button id="stickerBtn">😃</button>

        <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;">
        <button id="attachBtn" onclick="document.getElementById('mediaInput').click()">📎</button>
        
        <button id="recordBtn">🎤</button>

        <input type="text" id="messageInput" placeholder="أدخل رسالتك هنا...">
        <button id="sendBtn">إرسال</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let myUserId = localStorage.getItem("chat_user_id");
        if (!myUserId) {
            myUserId = "user-" + Math.random().toString(36).substring(2, 9);
            localStorage.setItem("chat_user_id", myUserId);
        }

        let myUsername = localStorage.getItem("chat_username") || "مستخدم";

        let activeReplyData = null;

        const socket = io({
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000
        });

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');
        const maxUsers = urlParams.get('maxUsers') || 24;
        const isHost = urlParams.get('isHost') === 'true';

        const roomIdText = document.getElementById('roomIdText');
        const copyButton = document.getElementById('copyRoomId');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatContainer = document.getElementById('chatContainer');
        const mediaInput = document.getElementById('mediaInput');
        const recordBtn = document.getElementById('recordBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const stickerBtn = document.getElementById('stickerBtn');
        const stickerPicker = document.getElementById('stickerPicker');
        const clearChatBtn = document.getElementById('clearChatBtn');

        const hostControls = document.getElementById('hostControls');
        const capacityInput = document.getElementById('capacityInput');
        const updateCapacityBtn = document.getElementById('updateCapacityBtn');

        const replyPreview = document.getElementById('replyPreview');
        const replyTargetUser = document.getElementById('replyTargetUser');
        const replyTargetText = document.getElementById('replyTargetText');

        roomIdText.textContent = roomId;

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function joinRoom() {
            if (roomId) {
                socket.emit('join-room', { roomId, userId: myUserId, username: myUsername, maxUsers, isHost });
            }
        }

        socket.on('connect', () => {
            joinRoom();
        });

        // ==========================================
        // استقبال أرشيف المحادثات عند الـ Refresh أو الانضمام
        // ==========================================
        socket.on('load-history', (history) => {
            chatContainer.innerHTML = ''; // مسح العناصر القديمة قبل استرجاع السجل لتفادي التكرار
            if (Array.isArray(history)) {
                history.forEach((data) => {
                    if (data.type === 'text') {
                        renderTextMessage(data);
                    } else if (data.type === 'media') {
                        renderMediaItem(data);
                    }
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        });

        socket.on('room-info', (data) => {
            if (data.isHost) {
                hostControls.style.display = 'flex';
                hostControls.style.alignItems = 'center';
                hostControls.style.gap = '10px';
                capacityInput.value = data.maxUsers;
            }
        });

        socket.on('room-full', (data) => {
            alert(data.message);
            window.location.href = '/';
        });

        updateCapacityBtn.addEventListener('click', () => {
            const newMax = capacityInput.value;
            if (newMax > 0) {
                socket.emit('update-room-capacity', { roomId, newMax });
            }
        });

        socket.on('capacity-updated', (data) => {
            capacityInput.value = data.maxUsers;
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (!socket.connected) {
                    socket.connect();
                } else {
                    joinRoom();
                }
            }
        });

        copyButton.addEventListener('click', () => {
            navigator.clipboard.writeText(roomId).then(() => {
                copyButton.textContent = "✔️"; 
                setTimeout(() => copyButton.textContent = "📋", 1500); 
            }).catch(err => console.error("Failed to copy:", err));
        });

        clearChatBtn.addEventListener('click', () => {
            if (confirm("هل انت متاكد من مسح جميع الرسائل في هذه الغرفة؟")) {
                socket.emit('clear-room-history', roomId);
            }
        });

        socket.on('chat-cleared', () => {
            chatContainer.innerHTML = '';
        });

        stickerPicker.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        stickerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            stickerPicker.style.display = stickerPicker.style.display === 'block' ? 'none' : 'block';
        });

        document.addEventListener('click', () => {
            stickerPicker.style.display = 'none';
            closeAllReactionPickers();
        });

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        function insertEmoji(emoji) {
            messageInput.value += emoji;
            messageInput.focus();
        }

        function sendSticker(stickerUrl) {
            if (!roomId) return;
            socket.emit('send-media', {
                roomId: roomId,
                msgId: 'msg-' + Date.now(),
                fileData: stickerUrl,
                fileType: 'sticker',
                userId: myUserId,
                username: myUsername,
                time: getCurrentTime(),
                replyTo: activeReplyData
            });
            stickerPicker.style.display = 'none';
            cancelReply();
        }

        let typingTimeout;
        function sendStatus(statusText) {
            if (roomId) socket.emit('user-typing', { roomId, status: statusText ? `${myUsername} ${statusText}` : '' });
        }

        messageInput.addEventListener('input', () => {
            if (messageInput.value.length > 0) {
                sendStatus('يكتب الآن...');
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => sendStatus(''), 2000);
            } else {
                sendStatus('');
            }
        });

        socket.on('user-typing-status', (data) => {
            statusIndicator.textContent = data.status;
        });

        function setReply(msgId, username, text) {
            activeReplyData = { msgId, username, text };
            replyTargetUser.textContent = username;
            replyTargetText.textContent = text;
            replyPreview.style.display = 'block';
            messageInput.focus();
        }

        function cancelReply() {
            activeReplyData = null;
            replyPreview.style.display = 'none';
        }

        function sendMessage() {
            const message = messageInput.value.trim();
            if (message && roomId) {
                const msgId = 'msg-' + Date.now();
                const time = getCurrentTime();
                socket.emit('user-message', { 
                    roomId, 
                    msg: message, 
                    msgId, 
                    userId: myUserId, 
                    username: myUsername, 
                    time,
                    replyTo: activeReplyData
                });
                messageInput.value = '';
                sendStatus('');
                cancelReply();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function toggleReactionPicker(e, msgId) {
            e.stopPropagation();
            closeAllReactionPickers();
            const picker = document.getElementById(`reaction-picker-${msgId}`);
            if (picker) {
                picker.style.display = picker.style.display === 'flex' ? 'none' : 'flex';
            }
        }

        function closeAllReactionPickers() {
            document.querySelectorAll('.reaction-picker-mini').forEach(p => p.style.display = 'none');
        }

        function sendReaction(msgId, emoji) {
            socket.emit('send-reaction', {
                roomId,
                msgId,
                emoji,
                userId: myUserId
            });
            closeAllReactionPickers();
        }

        socket.on('receive-reaction', (data) => {
            const reactionsContainer = document.getElementById(`reactions-${data.msgId}`);
            if (!reactionsContainer) return;

            let badge = reactionsContainer.querySelector(`[data-emoji="${data.emoji}"]`);
            if (badge) {
                let count = parseInt(badge.getAttribute('data-count')) + 1;
                badge.setAttribute('data-count', count);
                badge.textContent = `${data.emoji} ${count}`;
            } else {
                badge = document.createElement('span');
                badge.className = 'reaction-badge';
                badge.setAttribute('data-emoji', data.emoji);
                badge.setAttribute('data-count', '1');
                badge.textContent = `${data.emoji} 1`;
                reactionsContainer.appendChild(badge);
            }
        });

        function renderTextMessage(data) {
            if (!data.msgId) data.msgId = 'msg-' + Date.now();
            if (document.getElementById(`msg-element-${data.msgId}`)) return;

            const isOwnMessage = (data.userId === myUserId);
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', isOwnMessage ? 'sent' : 'received');
            messageElement.id = `msg-element-${data.msgId}`;

            const displayName = isOwnMessage ? 'أنت' : (data.username || 'مستخدم');
            const senderHeader = `<strong style="font-size: 11px; display: block; margin-bottom: 3px; color: ${isOwnMessage ? '#d1c4e9' : '#007bff'};">${displayName}</strong>`;

            let replyHtml = '';
            if (data.replyTo) {
                replyHtml = `<div class="reply-box-in-msg">
                    <strong>${data.replyTo.username}:</strong> ${data.replyTo.text}
                </div>`;
            }

            const ticksHtml = isOwnMessage ? `<span id="tick-${data.msgId}" style="color: gray; margin-left: 4px;">✓</span>` : '';
            const timeHtml = `<span style="font-size: 10px; color: #888; margin-left: 8px;">${data.time || ''}</span>`;
            
            const actionsHtml = `
                <span class="message-actions" onclick="setReply('${data.msgId}', '${displayName}', '${(data.msg || '').replace(/'/g, "\\'")}')">↩️</span>
                <span class="message-actions" onclick="toggleReactionPicker(event, '${data.msgId}')">😀</span>
                <div id="reaction-picker-${data.msgId}" class="reaction-picker-mini">
                    <span onclick="sendReaction('${data.msgId}', '👍')">👍</span>
                    <span onclick="sendReaction('${data.msgId}', '❤️')">❤️</span>
                    <span onclick="sendReaction('${data.msgId}', '😂')">😂</span>
                    <span onclick="sendReaction('${data.msgId}', '🔥')">🔥</span>
                    <span onclick="sendReaction('${data.msgId}', '😮')">😮</span>
                </div>
            `;

            const reactionsBarHtml = `<div id="reactions-${data.msgId}" class="reactions-bar"></div>`;

            messageElement.innerHTML = `${senderHeader}${replyHtml}<span>${data.msg || ''}</span> ${timeHtml} ${ticksHtml} ${actionsHtml} ${reactionsBarHtml}`;
            chatContainer.appendChild(messageElement);

            if (!isOwnMessage) {
                socket.emit('mark-as-read', { roomId, messageId: data.msgId });
            }
        }

        socket.on('broadcast-message', (data) => {
            renderTextMessage(data);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        socket.on('message-read-status', (data) => {
            const tickElement = document.getElementById(`tick-${data.messageId}`);
            if (tickElement) {
                tickElement.textContent = '✓✓';
                tickElement.style.color = '#34b7f1';
            }
        });

        mediaInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file || !roomId) return;

            const fileType = file.type.startsWith('image') ? 'image' : 'video';
            const tempId = 'upload_' + Date.now();
            const msgId = 'msg-' + Date.now();
            const objectUrl = URL.createObjectURL(file);

            const messageElement = document.createElement('div');
            messageElement.id = tempId;
            messageElement.classList.add('message', 'sent');

            const senderLabel = document.createElement('strong');
            senderLabel.style.fontSize = '11px';
            senderLabel.style.display = 'block';
            senderLabel.style.marginBottom = '3px';
            senderLabel.style.color = '#d1c4e9';
            senderLabel.textContent = 'أنت';
            messageElement.appendChild(senderLabel);

            const mediaContainer = document.createElement('div');
            mediaContainer.className = 'media-preview-container';

            let mediaEl;
            if (fileType === 'image') {
                mediaEl = document.createElement('img');
                mediaEl.style.maxWidth = '200px';
            } else {
                mediaEl = document.createElement('video');
                mediaEl.controls = true;
                mediaEl.style.maxWidth = '240px';
            }
            mediaEl.src = objectUrl;
            mediaEl.style.borderRadius = '8px';
            mediaEl.style.display = 'block';
            mediaContainer.appendChild(mediaEl);

            const overlay = document.createElement('div');
            overlay.className = 'media-upload-overlay';
            overlay.innerHTML = `
                <div class="progress-circle">
                    <span id="time-${tempId}" style="font-size: 11px; font-weight: bold; color: #fff;">...</span>
                    <span id="percent-${tempId}" style="font-size: 9px; color: #1ac14a; margin-top: 1px;">0%</span>
                </div>
            `;
            mediaContainer.appendChild(overlay);
            
            messageElement.appendChild(mediaContainer);
            chatContainer.appendChild(messageElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            sendStatus(fileType === 'image' ? 'يرسل صورة...' : 'يرسل فيديو...');

            const reader = new FileReader();
            const startTime = Date.now();

            reader.onprogress = function (event) {
                if (event.lengthComputable && event.loaded > 0) {
                    const elapsedTime = (Date.now() - startTime) / 1000;
                    const uploadSpeed = event.loaded / elapsedTime;
                    const remainingBytes = event.total - event.loaded;
                    const remainingSeconds = Math.ceil(remainingBytes / uploadSpeed);

                    const percent = Math.round((event.loaded / event.total) * 100);

                    const timeTxt = document.getElementById(`time-${tempId}`);
                    const percentTxt = document.getElementById(`percent-${tempId}`);

                    if (timeTxt) {
                        timeTxt.innerText = remainingSeconds > 0 ? `${remainingSeconds}s` : '0s';
                    }
                    if (percentTxt) {
                        percentTxt.innerText = percent + '%';
                    }
                }
            };

            reader.onload = function(event) {
                socket.emit('send-media', {
                    roomId: roomId,
                    msgId: msgId,
                    fileData: event.target.result,
                    fileType: fileType,
                    userId: myUserId,
                    username: myUsername,
                    time: getCurrentTime(),
                    replyTo: activeReplyData
                });

                mediaInput.value = '';
                sendStatus('');
                cancelReply();
                URL.revokeObjectURL(objectUrl);
                
                const elem = document.getElementById(tempId);
                if (elem) elem.remove();
            };

            reader.readAsDataURL(file);
        });

        let mediaRecorder;
        let audioChunks = [];

        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    
                    mediaRecorder.onstop = () => {
                        sendStatus('');
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            socket.emit('send-media', {
                                roomId: roomId,
                                msgId: 'msg-' + Date.now(),
                                fileData: reader.result,
                                fileType: 'audio',
                                userId: myUserId,
                                username: myUsername,
                                time: getCurrentTime(),
                                replyTo: activeReplyData
                            });
                            cancelReply();
                        };
                        reader.readAsDataURL(audioBlob);
                    };

                    mediaRecorder.start();
                    sendStatus('يسجل صوت... 🎤');
                    recordBtn.textContent = "⏹️";
                    recordBtn.style.backgroundColor = "#ff4d4d";
                } catch (err) {
                    alert("يرجى السماح بصلاحية المايكروفون للتسجيل!");
                }
            } else {
                mediaRecorder.stop();
                recordBtn.textContent = "🎤";
                recordBtn.style.backgroundColor = "";
            }
        });

        function renderMediaItem(data) {
            if (!data.msgId) data.msgId = 'msg-' + Date.now();
            if (document.getElementById(`msg-element-${data.msgId}`)) return;

            const isOwnMessage = (data.userId === myUserId);
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', isOwnMessage ? 'sent' : 'received');
            messageElement.id = `msg-element-${data.msgId}`;

            const displayName = isOwnMessage ? 'أنت' : (data.username || 'مستخدم');
            const senderLabel = document.createElement('strong');
            senderLabel.style.fontSize = '11px';
            senderLabel.style.display = 'block';
            senderLabel.style.marginBottom = '3px';
            senderLabel.style.color = isOwnMessage ? '#d1c4e9' : '#007bff';
            senderLabel.textContent = displayName;
            messageElement.appendChild(senderLabel);

            if (data.replyTo) {
                const replyDiv = document.createElement('div');
                replyDiv.className = 'reply-box-in-msg';
                replyDiv.innerHTML = `<strong>${data.replyTo.username}:</strong> ${data.replyTo.text}`;
                messageElement.appendChild(replyDiv);
            }

            let mediaSummaryText = `[${data.fileType}]`;

            if (data.fileType === 'sticker') {
                const stickerImg = document.createElement('img');
                stickerImg.src = data.fileData;
                stickerImg.classList.add('animated-sticker-msg');
                messageElement.appendChild(stickerImg);
                mediaSummaryText = 'ملصق 👾';
            } else if (data.fileType === 'image') {
                const img = document.createElement('img');
                img.src = data.fileData;
                img.style.maxWidth = '200px';
                img.style.borderRadius = '8px';
                img.style.display = 'block';
                messageElement.appendChild(img);
                mediaSummaryText = 'صورة 📷';
            } else if (data.fileType === 'video') {
                const video = document.createElement('video');
                video.src = data.fileData;
                video.controls = true;
                video.style.maxWidth = '240px';
                video.style.borderRadius = '8px';
                video.style.display = 'block';
                messageElement.appendChild(video);
                mediaSummaryText = 'فيديو 🎥';
            } else if (data.fileType === 'audio') {
                const audio = document.createElement('audio');
                audio.src = data.fileData;
                audio.controls = true;
                audio.style.maxWidth = '220px';
                audio.style.display = 'block';
                messageElement.appendChild(audio);
                mediaSummaryText = 'رسالة صوتية 🎤';
            }

            const footerDiv = document.createElement('div');
            footerDiv.style.marginTop = '4px';

            const timeSpan = document.createElement('span');
            timeSpan.style.fontSize = '10px';
            timeSpan.style.color = '#888';
            timeSpan.style.marginLeft = '8px';
            timeSpan.textContent = data.time || '';
            footerDiv.appendChild(timeSpan);

            if (isOwnMessage) {
                const tickSpan = document.createElement('span');
                tickSpan.id = `tick-${data.msgId}`;
                tickSpan.style.color = 'gray';
                tickSpan.style.marginLeft = '4px';
                tickSpan.textContent = '✓';
                footerDiv.appendChild(tickSpan);
            }

            const actionsDiv = document.createElement('div');
            actionsDiv.style.display = 'inline-block';
            actionsDiv.innerHTML = `
                <span class="message-actions" onclick="setReply('${data.msgId}', '${displayName}', '${mediaSummaryText}')">↩️</span>
                <span class="message-actions" onclick="toggleReactionPicker(event, '${data.msgId}')">😀</span>
                <div id="reaction-picker-${data.msgId}" class="reaction-picker-mini">
                    <span onclick="sendReaction('${data.msgId}', '👍')">👍</span>
                    <span onclick="sendReaction('${data.msgId}', '❤️')">❤️</span>
                    <span onclick="sendReaction('${data.msgId}', '😂')">😂</span>
                    <span onclick="sendReaction('${data.msgId}', '🔥')">🔥</span>
                    <span onclick="sendReaction('${data.msgId}', '😮')">😮</span>
                </div>
            `;
            footerDiv.appendChild(actionsDiv);

            const reactionsBar = document.createElement('div');
            reactionsBar.id = `reactions-${data.msgId}`;
            reactionsBar.className = 'reactions-bar';
            footerDiv.appendChild(reactionsBar);

            messageElement.appendChild(footerDiv);
            chatContainer.appendChild(messageElement);

            if (!isOwnMessage) {
                socket.emit('mark-as-read', { roomId, messageId: data.msgId });
            }
        }

        // تم التعديل ليستمع إلى receive-media كما يرسله السيرفر تماماً
        socket.on('receive-media', (data) => {
            renderMediaItem(data);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });
    </script>
</body>

</html>
